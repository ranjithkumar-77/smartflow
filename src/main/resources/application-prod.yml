spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: false

server:
  forward-headers-strategy: framework
  port: ${PORT:8080}

smartflow:
  jwt-secret: ${SMARTFLOW_JWT_SECRET}
