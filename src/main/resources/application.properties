spring.application.name=smartflow

spring.datasource.url=jdbc:h2:mem:smartflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.flyway.enabled=false
spring.jpa.open-in-view=false
# Local development/test fallback. The production profile still requires
# SMARTFLOW_JWT_SECRET to be provided by the deployment environment.
smartflow.jwt-secret=${SMARTFLOW_JWT_SECRET:smartflow-local-development-key-change-for-production-123456}
